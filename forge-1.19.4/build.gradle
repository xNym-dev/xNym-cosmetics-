plugins {
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = project.mod_version
group = 'fr.xnym'
base { archivesName = 'xnymcosmetics-forge-1.19.4' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets.main {
    java.srcDirs '../common/src/main/java', '../shared-1.19.4/src/main/java'
    resources.srcDirs '../common/src/main/resources', '../shared-1.19.4/src/main/resources'
}

minecraft {
    mappings channel: 'official', version: '1.19.4'
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.19.4-45.4.5'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, 'xnymcosmetics.refmap.json'
    config 'xnymcosmetics.mixins.json'
}

tasks.named('processResources', ProcessResources).configure {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand 'version': project.version }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'   : 'xnymcosmetics',
            'Implementation-Version': project.version,
            'MixinConfigs'          : 'xnymcosmetics.mixins.json'
        ])
    }
}
jar.finalizedBy 'reobfJar'

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
